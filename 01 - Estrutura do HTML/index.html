<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Título na aba do navegador</title>

        <style>
            /* Formatando o cabeçalho 1 */
            #cabecalho-1 {
                color: blue;
            }

            /* Formatando a classe fundo-vermelho */
            .fundo-vermelho {
                background-color: red;
            }
        </style>
    </head>

    <body>
        <!-- id só pode ser usado uma vez, já class pode ser usado várias vezes. -->
        <h1 id="cabecalho-1">Olá, mundo!</h1>
        <h2 class="fundo-vermelho">Subtítulo 1</h2>
        <h3>Subtítulo 3</h3>
        <h4>Subtítulo 4</h4>
        <h5>Subtítulo 5</h5>
        <h6>Subtítulo 6</h6>
        <p>
            Este é o meu primeiro parágrafo.
        </p>
    </body>

</html>
